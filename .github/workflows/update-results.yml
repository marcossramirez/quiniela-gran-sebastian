name: Actualizar resultados

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: node scripts/update-results.mjs
      - name: Guardar resultados nuevos
        run: |
          git config user.name "Quiniela actualizador"
          git config user.email "actions@github.com"
          git add data/results.json data/archive.json
          git diff --staged --quiet || git commit -m "Actualizar resultados"
          git push
